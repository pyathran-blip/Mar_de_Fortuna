name: Construir e publicar APK Mar de Fortuna

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar componentes del Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo 'sdkmanager não encontrado'; exit 1; fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Copiar o jogo para os recursos do Android
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html

      - name: Compilar APK de teste
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar nome do APK público
        run: cp app/build/outputs/apk/debug/app-debug.apk Mar-de-Fortuna.apk

      - name: Disponibilizar artefato temporário
        uses: actions/upload-artifact@v4
        with:
          name: Mar-de-Fortuna-APK
          path: Mar-de-Fortuna.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK em uma Release pública
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Mar de Fortuna APK (build ${{ github.run_number }})
          body: |
            APK Android de teste do jogo Mar de Fortuna.
            
            Instale no Android por sua conta e risco; esta é uma versão de teste, não uma publicação da Google Play.
          files: Mar-de-Fortuna.apk
          make_latest: true
